name: Bug report
description: Something in FTPilot isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: input
    id: ftpilot-version
    attributes:
      label: FTPilot version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / config
      description: Paste any error output or your `.ftbdeploy/config.json`. Redact real hostnames, usernames, and any credentials first.
